services:

  mongo1:
    image: mongo:5
    command: ["--replSet", "my-replica-set", "--bind_ip_all", "--port", "30001"]
    volumes:
      - mongo1:/data/db
    ports:
      - 30001:30001
    networks:
      - mongo-cluster
    # healthcheck:
    #   test: test $$(echo "rs.initiate({_id:'my-replica-set',members:[{_id:0,host:\"mongo1:30001\"},{_id:1,host:\"mongo2:30002\"},{_id:2,host:\"mongo3:30003\"}]}).ok || rs.status().ok" | mongo --port 30001 --quiet) -eq 1
    #   interval: 10s
    #   start_period: 30s

  mongo2:
    image: mongo:5
    command: ["--replSet", "my-replica-set", "--bind_ip_all", "--port", "30002"]
    volumes:
      - mongo2:/data/db
    ports:
      - 30002:30002
    networks:
      - mongo-cluster

  mongo3:
    image: mongo:5
    command: ["--replSet", "my-replica-set", "--bind_ip_all", "--port", "30003"]
    volumes:
      - mongo3:/data/db
    ports:
      - 30003:30003
    networks:
      - mongo-cluster

  mongodb_exporter:
    image: percona/mongodb_exporter:0.43.1
    environment:
      - MONGO_URI=mongodb://mongo1:30001,mongo2:30002,mongo3:30003  # URI реплика сета
    networks:
      - mongo-cluster
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    networks:
      - mongo-cluster
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://mongo1:30001/
      ME_CONFIG_BASICAUTH: "false"


  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    networks:
      - mongo-cluster
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - mongo-cluster
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin

networks:
  mongo-cluster:
    driver: overlay

volumes:
  mongo1:
  mongo2:
  mongo3:
